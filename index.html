  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d0614;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: relative;
      /* Valores iniciales: el tamaño real lo calcula resizeGame() en JS */
      height: 100vh;
      width: 56.25vh;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      background: #000;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    #ui {
      position: absolute;
      top: 30px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: clamp(14px, 3.6vw, 32px);
      font-weight: 800;
      text-shadow: 3px 3px 6px #000;

    .hud-box { display: flex; align-items: center; gap: 8px; }
    #vampire-meter { display: none; color: #ff3366; }
    #lives-counter { letter-spacing: 2px; }
    
    .overlay-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      gap: 25px;
      z-index: 20;

    #loader-screen {
      background-image: url('https://i.postimg.cc/zB6D7LCY/PORTADA-GAME-GUAJI.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 0;
      gap: 0;
    }

    #loading-group {
      position: absolute;
      bottom: 15%;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 12px;
      z-index: 22;
    }

    #loading-text {
      color: #ffffff;
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 900;
      letter-spacing: 3px;

      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 3px 3px 6px #000;
    }

    #loading-bar-container {
      width: 75%;
      max-width: 450px;
      height: 22px;
      background: rgba(15, 10, 25, 0.85);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #5a357a;

    #loading-bar {
      width: 0%;

      background: linear-gradient(90deg, #7928ca, #0070f3);

    #btn-start {
      display: none;

    #btn-start:hover {

    #game-over-screen {
      background-image: url('https://i.postimg.cc/BvJCZb1f/ending-game-guaki.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: transparent;
      justify-content: flex-end;
      padding-bottom: 12%;
    }

    #score-board {
      background: rgba(10, 5, 20, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 24px 44px;

      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.22);

    #score-board p {

    #btn-restart {
      width: clamp(220px, 30vw, 300px);

      touch-action: manipulation;

<body>

<div id="game-container">
  <canvas id="gameCanvas" width="1080" height="1920"></canvas>
  
  <div id="ui">
    <div class="hud-box" id="lives-counter">❤️❤️❤️</div>
    <div class="hud-box">⭐ <span id="coin-counter">0</span></div>

  <div id="loader-screen" class="overlay-screen">
    <div id="loading-group">
      <div id="loading-text">CARGANDO...</div>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
    </div>
    <img id="btn-start" src="https://i.postimg.cc/1541WRWr/magnific-a-casual-mobile-game-ui-button-rectangular-with-ro-56462.png" alt="Iniciar Juego">
  </div>

  <div id="game-over-screen" class="overlay-screen" style="display: none;">
    <div id="score-board">
      <p>Distancia: <span id="final-score" style="color: #00e5ff;">0</span>m</p>
      <p>Estrellas: <span id="final-coins" style="color: #ffd700;">0</span></p>
    </div>
    <img id="btn-restart" src="https://i.postimg.cc/HsjRHZ1z/magnific-an-interface-button-for-a-casual-mobile-game-recta-56465.png" alt="Reintentar Partida">
  </div>
</div>

<script>
const PLAYER_TOTAL_FRAMES = 6; 
const VISUAL_Y_OFFSET = 35;

const ASSETS_CONFIG = {
  macawNormal: 'https://i.postimg.cc/GpqTpY7T/magnific-16bit-pixel-art-sprite-sheet-of-an-anthropomorphic-43814.png',
  macawVampire: 'https://i.postimg.cc/J4dqrp4R/magnific-a-16bit-pixel-art-sprite-sheet-of-a-blue-macaw-cha-43818.png',
  mummy: 'https://i.postimg.cc/jjJLQ9ZY/pixel-art-mummy-pixelated-halloween-mummy-halloween-mummy-character-icon-video-games-asset.png',
  bat: 'https://i.postimg.cc/T3LMHXm1/magnific-pixel-art-illustration-of-a-small-cute-bat-in-flig-43812.png',
  potion: 'https://i.postimg.cc/VNF1PPsw/magnific-16bit-pixel-art-of-a-fantasy-magical-potion-bottle-43815.png',
  coin: 'https://i.postimg.cc/rmRrydST/estrella.png',
  bgFar: 'https://i.postimg.cc/tJGsjXk2/magnific-16bit-pixel-art-seamless-horizontal-background-pat-43817.jpg',
  bgMid: '',
  bgFloor: 'https://i.postimg.cc/g2VqpNft/magnific-a-16bit-pixelart-seamless-horizontal-terrain-tile-43816.png'
};

const AUDIO_CONFIG = {
  menuMusic: 'https://github.com/dgrafico-ctrl/morichal/raw/refs/heads/main/intro.mp3',
  gameMusic: 'https://github.com/dgrafico-ctrl/morichal/raw/refs/heads/main/acci%C3%B3n.mp3',
  gameOverSfx: 'https://github.com/dgrafico-ctrl/morichal/raw/refs/heads/main/game%20over.mp3'
};

const audios = {
  menuMusic: new Audio(AUDIO_CONFIG.menuMusic),
  gameMusic: new Audio(AUDIO_CONFIG.gameMusic),
  gameOverSfx: new Audio(AUDIO_CONFIG.gameOverSfx)
};

audios.menuMusic.loop = true;
audios.gameMusic.loop = true;

function startMenuAudio() {
  if (gameState === 'LOADING' && audios.menuMusic && audios.menuMusic.paused) {
    audios.menuMusic.play().catch(() => {});
  }
}

window.addEventListener('pointerdown', startMenuAudio, { once: true });
window.addEventListener('touchstart', startMenuAudio, { once: true });
window.addEventListener('click', startMenuAudio, { once: true });

const images = {};
const gameContainer = document.getElementById('game-container');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiCoins = document.getElementById('coin-counter');
const uiScore = document.getElementById('score-counter');
const uiVampire = document.getElementById('vampire-meter');
const uiTimer = document.getElementById('timer-val');
const uiLives = document.getElementById('lives-counter');
const gameOverScreen = document.getElementById('game-over-screen');
const btnRestart = document.getElementById('btn-restart');
const loaderScreen = document.getElementById('loader-screen');
const loadingGroup = document.getElementById('loading-group');
const loadingBar = document.getElementById('loading-bar');
const btnStart = document.getElementById('btn-start');

let gameState = 'LOADING';
let score = 0;
let coins = 0;

// SISTEMA DE VIDAS E I-FRAMES
let lives = 3;
let isInvulnerable = false;
let invulnerableTimer = 0;

// ALTO ADAPTABLE: el ancho lógico es fijo (1080) y el alto se ajusta a la pantalla.
const GAME_W = 1080;
const BASE_H = 1920;       // alto lógico en pantallas 9:16
const MAX_H = 2600;        // tope para pantallas extremadamente altas
const FLOOR_MARGIN = 240;  // distancia del suelo al borde inferior
let FLOOR_Y = BASE_H - FLOOR_MARGIN; 
const GRAVITY = 1.35;
const BASE_SPEED = 9.5; // velocidad inicial (antes 8.5)
let gameSpeed = BASE_SPEED; 

const parallax = [
  { scroll: 0, speedMult: 0.35, key: 'bgFar' },
  { scroll: 0, speedMult: 0.6,  key: 'bgMid' },
  { scroll: 0, speedMult: 1.0,  key: 'bgFloor' }
];

let isHoldingJump = false;

const player = {
  x: 140,
  w: 155,
  h: 160,
  y: FLOOR_Y - 160,
  vy: 0,
  jumpPower: -26,
  grounded: false,
  isVampire: false,
  vampireTimer: 0,
  animTick: 0,
  runAnimSpeed: 0.16,
  flyAnimSpeed: 0.20
};

let obstacles = [];
let pickups = [];
let spawnTick = 0;

// Ajusta contenedor y canvas al tamaño real de la pantalla sin estirar nada:
// en pantallas más altas que 9:16 el mundo gana altura (más cielo arriba) y el suelo
// se mantiene pegado abajo; en pantallas anchas (PC) se muestra una columna 9:16 centrada.
function resizeGame() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  if (!vw || !vh) return;

  let cw, ch;
  if (vh / vw >= BASE_H / GAME_W) {
    cw = vw;
    ch = Math.min(vh, vw * (MAX_H / GAME_W));
  } else {
    ch = vh;
    cw = vh * (GAME_W / BASE_H);
  }

  gameContainer.style.width = cw + 'px';
  gameContainer.style.height = ch + 'px';

  const newH = Math.round(GAME_W * ch / cw);
  if (newH !== canvas.height) {
    const oldFloor = FLOOR_Y;
    canvas.height = newH;
    FLOOR_Y = newH - FLOOR_MARGIN;
    const dy = FLOOR_Y - oldFloor;
    player.y += dy;
    obstacles.forEach(o => { o.y += dy; });
    pickups.forEach(p => { p.y += dy; });
  }
}

window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', () => setTimeout(resizeGame, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeGame);
resizeGame();

function updateLivesHUD() {
  uiLives.innerText = '❤️'.repeat(Math.max(0, lives));
}

function preloadAssets() {
  const keys = Object.keys(ASSETS_CONFIG);
  const activeKeys = keys.filter(k => ASSETS_CONFIG[k] && ASSETS_CONFIG[k].trim() !== '');
  let loadedCount = 0;

  const showReadyUI = () => {
    loadingGroup.style.display = 'none';
    btnStart.style.display = 'block';
    startMenuAudio();
  };

  if (activeKeys.length === 0) {
    showReadyUI();
    return;
  }

  const promises = activeKeys.map(key => {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        images[key] = { img, loaded: true };
        loadedCount++;
        const percent = Math.floor((loadedCount / activeKeys.length) * 100);
        loadingBar.style.width = percent + '%';
        resolve();
      };
      img.onerror = () => {
        console.warn(`Error al cargar: "${key}".`);
        images[key] = { img: null, loaded: false };
        loadedCount++;
        resolve();
      };
      img.src = ASSETS_CONFIG[key];
    });
  });

  Promise.all(promises).then(() => {
    setTimeout(showReadyUI, 250);
  });
}

function launchGame() {
  loaderScreen.style.display = 'none';
  gameState = 'PLAYING';

  if (audios.menuMusic) {
    audios.menuMusic.pause();
    audios.menuMusic.currentTime = 0;
  }
  if (audios.gameMusic) {
    audios.gameMusic.currentTime = 0;
    audios.gameMusic.play().catch(() => {});
  }

  requestAnimationFrame(gameLoop);
}

btnStart.addEventListener('click', (e) => {
  e.stopPropagation();
  launchGame();
});
btnStart.addEventListener('touchend', (e) => {
  e.stopPropagation();
  e.preventDefault();
  launchGame();
});

btnRestart.addEventListener('click', (e) => {
  e.stopPropagation();
  resetGame();
});
btnRestart.addEventListener('touchend', (e) => {
  e.stopPropagation();
  e.preventDefault();
  resetGame();
});

function onInputStart() {
  if (gameState !== 'PLAYING') return;
  isHoldingJump = true;
  
  if (player.grounded && !player.isVampire) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }
}

function onInputEnd() {
  isHoldingJump = false;
}

window.addEventListener('keydown', e => { 
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!e.repeat) onInputStart();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    onInputEnd();
  }
});

window.addEventListener('touchstart', e => { 
  if (e.target.closest('#btn-start') || e.target.closest('#btn-restart')) return;
  e.preventDefault(); 
  onInputStart(); 
}, { passive: false });

window.addEventListener('touchend', e => { 
  if (e.target.closest('#btn-start') || e.target.closest('#btn-restart')) return;
  e.preventDefault(); 
  onInputEnd(); 
}, { passive: false });

// 1. CAJAS DE COLISIÓN AJUSTADAS (20% de margen interno en ambos lados)
function checkHitboxCollision(a, b) {
  const insetAX = a.w * 0.20;
  const insetAY = a.h * 0.20;
  const insetBX = b.w * 0.20;
  const insetBY = b.h * 0.20;

  const aLeft   = a.x + insetAX;
  const aRight  = a.x + a.w - insetAX;
  const aTop    = a.y + insetAY;
  const aBottom = a.y + a.h - insetAY;

  const bLeft   = b.x + insetBX;
  const bRight  = b.x + b.w - insetBX;
  const bTop    = b.y + insetBY;
  const bBottom = b.y + b.h - insetBY;

  return aLeft < bRight && aRight > bLeft && aTop < bBottom && aBottom > bTop;
}

// Colisión simple para items (estrella y poción)
function checkItemCollision(p, item) {
  const padX = p.w * 0.15;
  const padY = p.h * 0.15;
  return p.x + padX < item.x + item.w &&
         p.x + p.w - padX > item.x &&
         p.y + padY < item.y + item.h &&
         p.y + p.h - padY > item.y;
}

function spawnEntities() {
  spawnTick++;
  
  if (spawnTick % 85 === 0) {
    const isBat = Math.random() > 0.55;
    obstacles.push({
      type: isBat ? 'bat' : 'mummy',
      x: canvas.width + 100,
      y: isBat ? FLOOR_Y - 320 - Math.random() * 350 : FLOOR_Y - 145,
      w: isBat ? 130 : 115,
      h: isBat ? 100 : 145,
      floatOffset: Math.random() * Math.PI
    });
  }

  if (spawnTick % 105 === 0) {
    const isPotion = Math.random() > 0.85;
    pickups.push({
      type: isPotion ? 'potion' : 'coin',
      x: canvas.width + 100,
      y: FLOOR_Y - 120 - Math.random() * 650,
      w: 85,
      h: 85
    });
  }
}

function update() {
  if (gameState !== 'PLAYING') return;

  score += 0.1;
  gameSpeed = BASE_SPEED + Math.floor(score / 50) * 0.20;
  uiScore.innerText = Math.floor(score);

  // LÓGICA VAMPIRO
  if (player.isVampire) {
    player.vampireTimer -= 1 / 60;
    uiTimer.innerText = Math.ceil(player.vampireTimer);
    if (player.vampireTimer <= 0) {
      player.isVampire = false;
      uiVampire.style.display = 'none';
    }

    if (isHoldingJump) {
      player.vy -= 1.6; 
      if (player.vy < -14) player.vy = -14;
    } else {
      player.vy += GRAVITY * 0.45;
    }
  } else {
    player.vy += GRAVITY;
  }

  // GESTIÓN DE INVULNERABILIDAD TEMPORAL TRAS DAÑO
  if (isInvulnerable) {
    invulnerableTimer -= 1 / 60;
    if (invulnerableTimer <= 0) {
      isInvulnerable = false;
      invulnerableTimer = 0;
    }
  }

  player.y += player.vy;

  if (player.y < 30) {
    player.y = 30;
    player.vy = 0;
  }

  if (player.y + player.h >= FLOOR_Y) {
    player.y = FLOOR_Y - player.h;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  if (player.isVampire) {
    player.animTick += player.flyAnimSpeed;
  } else {
    if (player.grounded) {
      player.animTick += player.runAnimSpeed;
    } else {
      player.animTick = 1;
    }
  }

  parallax.forEach(l => {
    l.scroll += gameSpeed * l.speedMult;
  });

  // 2. ACTUALIZACIÓN DE OBSTÁCULOS Y SISTEMA DE VIDAS
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let o = obstacles[i];
    o.x -= gameSpeed;
    if (o.type === 'bat') o.y += Math.sin(player.animTick * 1.5 + o.floatOffset) * 3;

    // Solo se evalúa daño si NO es vampiro y NO está en periodo de invulnerabilidad
    if (checkHitboxCollision(player, o)) {
      if (!player.isVampire && !isInvulnerable) {
        lives--;
        updateLivesHUD();

        if (lives > 0) {
          // Activa invulnerabilidad (1.8 segundos)
          isInvulnerable = true;
          invulnerableTimer = 1.8;
        } else {
          handleGameOver();
          return;
        }
      }
    }
    if (o.x + o.w < -120) obstacles.splice(i, 1);
  }

  // COLECCIONABLES
  for (let i = pickups.length - 1; i >= 0; i--) {
    let p = pickups[i];
    p.x -= gameSpeed;

    if (checkItemCollision(player, p)) {
      if (p.type === 'coin') {
        coins++;
        uiCoins.innerText = coins;
      } else if (p.type === 'potion') {
        player.isVampire = true;
        player.vampireTimer = 10;
        player.vy = -8;
        uiVampire.style.display = 'inline-block';
      }
      pickups.splice(i, 1);
      continue;
    }
    if (p.x + p.w < -120) pickups.splice(i, 1);
  }

  spawnEntities();
}

// 3. RENDERIZADO DEL JUGADOR CON EFECTO DE PARPADEO (FLICKER)
function drawPlayer() {
  const pKey = player.isVampire ? 'macawVampire' : 'macawNormal';
  const asset = images[pKey] && images[pKey].loaded ? images[pKey] : images['macawNormal'];

  ctx.save();

  // Si está en I-Frames, alternar opacidad cada 100 ms
  if (isInvulnerable) {
    const blink = Math.floor(Date.now() / 100) % 2 === 0;
    ctx.globalAlpha = blink ? 0.30 : 0.85;
  } else {
    ctx.globalAlpha = 1.0;
  }

  if (asset && asset.loaded) {
    const img = asset.img;
    const totalFrames = PLAYER_TOTAL_FRAMES;
    
    const frameWidth = img.naturalWidth / totalFrames;
    const frameHeight = img.naturalHeight;
    const frameIndex = Math.floor(player.animTick) % totalFrames;

    const cropPaddingX = player.isVampire ? 2 : 0;
    const cropWidthReduction = player.isVampire ? 4 : 0;

    const sx = (frameIndex * frameWidth) + cropPaddingX;
    const sy = 0;
    const sWidth = Math.max(1, frameWidth - cropWidthReduction);
    const sHeight = frameHeight;

    const drawOffsetY = player.isVampire ? Math.sin(player.animTick * 2) * 5 : 0;

    ctx.drawImage(
      img,
      sx, sy,
      sWidth, sHeight,
      player.x, player.y + drawOffsetY,
      player.w, player.h
    );
  } else {
    ctx.fillStyle = player.isVampire ? '#b5179e' : '#0070f3';
    ctx.fillRect(player.x, player.y, player.w, player.h);
  }

  ctx.restore();
}

function renderEntity(assetKey, fallbackColor, x, y, w, h) {
  if (images[assetKey] && images[assetKey].loaded) {
    ctx.drawImage(images[assetKey].img, x, y, w, h);
  } else {
    ctx.fillStyle = fallbackColor;
    ctx.fillRect(x, y, w, h);
  }
}

function renderParallaxLayer(layer) {
  const asset = images[layer.key];
  if (!asset || !asset.loaded) return;

  const img = asset.img;
  const isFloor = (layer.key === 'bgFloor');

  let drawY, targetHeight;

  if (isFloor) {
    drawY = FLOOR_Y - VISUAL_Y_OFFSET;
    targetHeight = canvas.height - drawY;
  } else {
    drawY = 0;
    targetHeight = canvas.height;
  }

  const scale = targetHeight / img.naturalHeight;
  const newWidth = img.naturalWidth * scale;

  if (newWidth <= 0) return;

  const offsetX = -(layer.scroll % newWidth);
  const tilesNeeded = Math.ceil((canvas.width - offsetX) / newWidth) + 1;

  for (let i = 0; i < tilesNeeded; i++) {
    ctx.drawImage(img, offsetX + (i * newWidth), drawY, newWidth, targetHeight);
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!images['bgFar'] || !images['bgFar'].loaded) {
    ctx.fillStyle = '#160926';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  parallax.forEach(layer => {
    renderParallaxLayer(layer);
  });

  pickups.forEach(p => {
    renderEntity(p.type, p.type === 'coin' ? '#ffcc00' : '#d946ef', p.x, p.y, p.w, p.h);
  });

  obstacles.forEach(o => {
    renderEntity(o.type, o.type === 'mummy' ? '#e2d9c8' : '#3c096c', o.x, o.y, o.w, o.h);
  });

  drawPlayer();
}

function gameLoop() {
  update();
  render();
  if (gameState === 'PLAYING') {
    requestAnimationFrame(gameLoop);
  }
}

function handleGameOver() {
  gameState = 'GAMEOVER';
  isHoldingJump = false;

  audios.gameMusic.pause();
  audios.gameMusic.currentTime = 0;

  audios.gameOverSfx.currentTime = 0;
  audios.gameOverSfx.play().catch(e => console.log("Error al reproducir sfx game over:", e));

  document.getElementById('final-score').innerText = Math.floor(score);
  document.getElementById('final-coins').innerText = coins;
  gameOverScreen.style.display = 'flex';
}

function resetGame() {
  audios.gameOverSfx.pause();
  audios.gameOverSfx.currentTime = 0;

  audios.gameMusic.currentTime = 0;
  audios.gameMusic.play().catch(e => console.log("Error al reiniciar música de juego:", e));

  player.y = FLOOR_Y - player.h;
  player.vy = 0;
  player.isVampire = false;
  player.vampireTimer = 0;
  isHoldingJump = false;

  // REINICIO DE VIDAS E I-FRAMES
  lives = 3;
  isInvulnerable = false;
  invulnerableTimer = 0;
  updateLivesHUD();

  obstacles = [];
  pickups = [];
  score = 0;
  coins = 0;
  gameSpeed = BASE_SPEED;
  uiCoins.innerText = '0';
  uiVampire.style.display = 'none';
  gameOverScreen.style.display = 'none';
  gameState = 'PLAYING';
  requestAnimationFrame(gameLoop);
}

window.onload = () => {
  resizeGame();
  updateLivesHUD();
  preloadAssets();
};
</script>
</body>
</html>
